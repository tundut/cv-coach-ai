name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép chạy thủ công từ GitHub UI

# OIDC cần quyền này để lấy token
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  STAGE: dev
  AI_PROVIDER: openai
  TEXTRACT_ENABLED: 'true'

jobs:
  deploy:
    name: Deploy to AWS (dev)
    runs-on: ubuntu-latest
    # Chỉ deploy khi CI đã pass (push main) — giữ đơn giản: tự chạy build+test ở đây luôn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      - name: Typecheck & Test
        run: |
          npm run typecheck
          npm run test

      - name: Build backend (Lambda bundles)
        run: npm run build --workspace @cv-coach/backend

      - name: Debug OIDC token subject
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Role ARN set: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}"
          echo "--- OIDC token sub ---"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Giải mã payload (phần giữa của JWT) để xem sub + aud
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository}' || echo "decode failed"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend (CDK)
        working-directory: packages/infra
        run: |
          npx cdk deploy \
            --context stage=${{ env.STAGE }} \
            --context aiProvider=${{ env.AI_PROVIDER }} \
            --context textractEnabled=${{ env.TEXTRACT_ENABLED }} \
            --context githubRepo=${{ github.repository }} \
            --require-approval never

      - name: Deploy frontend (S3 + CloudFront)
        run: bash scripts/deploy-frontend.sh ${{ env.STAGE }}
